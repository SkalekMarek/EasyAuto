<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Příprava na českou autoškolu s oficiálními otázkami Ministerstva dopravy.">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#191126">
    <title>EasyAuto · Příprava na autoškolu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/easyauto-ibiza-32.png">
    <link rel="preload" href="./assets/fonts/departure-mono.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/press-start-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./styles.css?v=ibiza">
    <script type="module" src="./src/app.js?v=ibiza"></script>
  </head>
  <body>
    <a class="skip" href="#main">Přeskočit na obsah</a>
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="#prehled">
          <span class="mark" data-pixel-fit="contain"><img src="./assets/easyauto-ibiza.png" alt="" width="48" height="48"></span>
          <span>Easy<span class="brand-accent">Auto</span><small>Příprava na autoškolu</small></span>
        </a>
        <button class="mobile-menu" id="mobile-menu" type="button" aria-expanded="false" aria-controls="sidebar-content">Menu</button>
        <div id="sidebar-content" class="sidebar-content">
          <button class="search-button" type="button" data-action="search">
            <span class="sprite sprite-search" aria-hidden="true"></span>Hledat <kbd>Ctrl K</kbd>

          <nav id="navigation" aria-label="Hlavní navigace"></nav>
          <div class="sidebar-footer"><button type="button" data-action="profile" id="profile-button">Můj profil</button></div>
        </div>
      </aside>
      <main id="main" tabindex="-1"><p role="status">Načítám otázky…</p></main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
